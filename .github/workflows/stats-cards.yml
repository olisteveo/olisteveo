name: Update profile stat cards

# Renders the cards to SVG files in this repo rather than hotlinking a shared
# public instance. That instance is what broke the old cards: it now returns
# 503 under load, and the Heroku host the streak card used was retired in 2022.
# Committed SVGs cannot go down, and STATS_PAT stays in this repo's secrets so
# no third-party service is granted access to the private repos.
#
# Note: the @v2 tag does not accept fail_on_error, so a data-fetch failure
# writes an error card rather than failing the run. Check the SVGs after any
# action upgrade.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stats-cards.yml']

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # count_private and include_all_commits need the PAT's repo scope; with
      # the default GITHUB_TOKEN these fall back to public-only numbers.
      - name: Most used languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          options: >-
            username=olisteveo&layout=compact&langs_count=8&theme=vision-friendly-dark&bg_color=0D1117&hide_border=true&hide=blade,html,css,scss,dockerfile,shell

      - name: Overall stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          options: >-
            username=olisteveo&show_icons=true&count_private=true&include_all_commits=true&theme=vision-friendly-dark&bg_color=0D1117&hide_border=true&rank_icon=github

      # The streak card comes from a different project with no Action, so fetch
      # it and commit it like the others. streak-stats.demolab.com timed out on
      # 2 of 8 cold requests when tested, hence the retries; if every attempt
      # fails the previously committed card is simply left in place.
      - name: Contribution streak
        run: |
          mkdir -p profile
          URL='https://streak-stats.demolab.com/?user=olisteveo&theme=dark&background=0D1117&hide_border=true'
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 -o /tmp/streak.svg "$URL" \
               && grep -q 'Total Contributions' /tmp/streak.svg; then
              mv /tmp/streak.svg profile/streak.svg
              echo "streak card updated on attempt $i"
              exit 0
            fi
            echo "attempt $i failed"
            sleep 10
          done
          echo "::warning::streak service unreachable, keeping the existing card"

      # Line the streak ring up under the rank circle on the stats card above.
      # stats.svg puts the rank circle at translate(390.5) + cx -10 = x 380.5;
      # streak.svg centres its ring at x 247.5. Both render at the same scale
      # (195 tall), so padding the streak viewBox left by the 133-unit
      # difference makes the two circles share a vertical line. The padding is
      # outside the card's clip path, so it stays transparent rather than
      # showing as a block of background.
      - name: Align streak ring with the rank circle
        run: |
          python3 - <<'EOF'
          import pathlib, re
          SHIFT = 133
          p = pathlib.Path("profile/streak.svg")
          s = p.read_text()
          s2, n1 = re.subn(r"viewBox='0 0 495 195'", f"viewBox='-{SHIFT} 0 {495 + SHIFT} 195'", s, count=1)
          s2, n2 = re.subn(r"width='495px'", f"width='{495 + SHIFT}px'", s2, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"streak.svg header changed upstream (viewBox={n1}, width={n2}); re-derive the offset")
          p.write_text(s2)
          print(f"padded streak.svg left by {SHIFT} units")
          EOF

      # The @v2 action writes a "Something went wrong" card instead of failing
      # when the token is rejected, so an expired PAT would quietly commit
      # broken cards over the good ones. Refuse to commit those.
      - name: Reject error cards
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if grep -qi "something went wrong\|Maximum retries exceeded\|Bad credentials" "$f"; then
              echo "::error::$f is an error card - check STATS_PAT has not expired"
              exit 1
            fi
          done
          echo "both cards look valid"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update profile stat cards"
          git push
