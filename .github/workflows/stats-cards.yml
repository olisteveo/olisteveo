name: Update profile stat cards

# Renders the cards to SVG files in this repo rather than hotlinking a shared
# public instance. That instance is what broke the old cards: it now returns
# 503 under load, and the Heroku host the streak card used was retired in 2022.
# Committed SVGs cannot go down, and STATS_PAT stays in this repo's secrets so
# no third-party service is granted access to the private repos.
#
# Note: the @v2 tag does not accept fail_on_error, so a data-fetch failure
# writes an error card rather than failing the run. Check the SVGs after any
# action upgrade.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stats-cards.yml']

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # count_private and include_all_commits need the PAT's repo scope; with
      # the default GITHUB_TOKEN these fall back to public-only numbers.
      - name: Most used languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          options: >-
            username=olisteveo&layout=compact&langs_count=8&theme=vision-friendly-dark&bg_color=0D1117&hide_border=true&hide=blade,html,css,scss,dockerfile,shell

      - name: Overall stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          options: >-
            username=olisteveo&show_icons=true&count_private=true&include_all_commits=true&theme=vision-friendly-dark&bg_color=0D1117&hide_border=true&rank_icon=github

      # The @v2 action writes a "Something went wrong" card instead of failing
      # when the token is rejected, so an expired PAT would quietly commit
      # broken cards over the good ones. Refuse to commit those.
      - name: Reject error cards
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if grep -qi "something went wrong\|Maximum retries exceeded\|Bad credentials" "$f"; then
              echo "::error::$f is an error card - check STATS_PAT has not expired"
              exit 1
            fi
          done
          echo "both cards look valid"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update profile stat cards"
          git push
